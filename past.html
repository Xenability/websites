<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperLords IAL Portal</title>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f1f5f9; }
        .overflow-y-auto { scroll-behavior: smooth; }
        /* Hide scrollbars for a cleaner look while keeping functionality */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CONFIG = {
            Maths: { folder: 'Maths', prefix: 'MATHS', units: ['P1', 'P2', 'P3', 'P4', 'S1', 'M1'] },
            Physics: { folder: 'Physics', prefix: 'PHYSICS', units: ['U1', 'U2', 'U3'] },
            Chemistry: { folder: 'Chemistry', prefix: 'CHEMISTRY', units: ['U1', 'U2', 'U3'] },
        };

        const YEARS = ['2026', '2025', '2024', '2023', '2022', '2021', '2020', '2019'];
        const MONTHS = [
            { label: 'January', value: 'Jan' },
            { label: 'May/June', value: 'MayJune' },
            { label: 'October', value: 'Oct' }
        ];

        const Icons = {
            BookOpen: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>,
            ExternalLink: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>,
            SplitSquare: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><line x1="12" x2="12" y1="3" y2="21"></line></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" x2="8" y1="13" y2="13"></line><line x1="16" x2="8" y1="17" y2="17"></line><line x1="10" x2="8" y1="9" y2="9"></line></svg>,
            Sparkles: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>,
            Send: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
        };

        function App() {
            const [subject, setSubject] = useState('Maths');
            const [unit, setUnit] = useState('P1');
            const [year, setYear] = useState('2025');
            const [month, setMonth] = useState('MayJune');
            const [viewMode, setViewMode] = useState('split'); 
            const [isAiOpen, setIsAiOpen] = useState(false);
            const [aiQuery, setAiQuery] = useState('');
            const [chatHistory, setChatHistory] = useState([]);
            const [isAiLoading, setIsAiLoading] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => { setUnit(CONFIG[subject].units[0]); }, [subject]);
            useEffect(() => { if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, isAiLoading]);

            const generateUrl = (type) => {
                const info = CONFIG[subject];
                const folderPath = `${info.folder}/${month}%20${year}`;
                const fileName = `IAL_${info.prefix}_${year}_${month}_${unit}_${type}.pdf`;
                return `https://archive.paperlords.org/library/IAL/${folderPath}/${fileName}`;
            };

            const handleAskAi = async () => {
                if (!aiQuery.trim() || isAiLoading) return;

                // --- METHOD 1: KEY RETRIEVAL ---
                let apiKey = sessionStorage.getItem('gemini_api_key');
                if (!apiKey) {
                    apiKey = prompt("To protect your data, the API key isn't stored in the code. Please enter your Gemini API Key:");
                    if (apiKey) {
                        sessionStorage.setItem('gemini_api_key', apiKey);
                    } else {
                        return; // User cancelled
                    }
                }

                const userMessage = aiQuery.trim();
                setChatHistory(prev => [...prev, { role: 'user', text: userMessage }]);
                setAiQuery('');
                setIsAiLoading(true);

                const promptText = `Context: User studying Edexcel IAL ${subject} (${unit}) - ${month} ${year}. Question: ${userMessage}`;

                const fetchGemini = async (retries = 3) => {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                        });
                        if (response.status === 403 || response.status === 400) {
                            sessionStorage.removeItem('gemini_api_key');
                            throw new Error("Invalid API Key. Please click AI Tutor again to re-enter it.");
                        }
                        const result = await response.json();
                        return result.candidates?.[0]?.content?.parts?.[0]?.text || "No response.";
                    } catch (error) {
                        if (retries > 0) return fetchGemini(retries - 1);
                        throw error;
                    }
                };

                try {
                    const aiResponseText = await fetchGemini();
                    setChatHistory(prev => [...prev, { role: 'ai', text: aiResponseText }]);
                } catch (error) {
                    setChatHistory(prev => [...prev, { role: 'ai', text: error.message }]);
                } finally {
                    setIsAiLoading(false);
                }
            };

            const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleAskAi(); } };

            const PdfViewer = ({ title, url, type }) => {
                const proxyUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
                return (
                    <div className="flex flex-col flex-1 h-full bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="flex justify-between items-center px-4 py-3 bg-slate-50 border-b border-slate-200">
                            <div className="flex items-center gap-2">
                                <span className={`px-2 py-1 text-[10px] font-bold rounded-md ${type === 'QP' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}`}>{type}</span>
                                <h2 className="font-semibold text-slate-700 text-xs md:text-sm truncate max-w-[150px] md:max-w-none">{title}</h2>
                            </div>
                            <a href={url} target="_blank" rel="noopener noreferrer" className="p-1.5 text-slate-500 hover:bg-slate-200 rounded-lg transition-colors"><Icons.ExternalLink /></a>
                        </div>
                        <div className="flex-1 bg-slate-100 relative">
                            <iframe src={proxyUrl} className="absolute inset-0 w-full h-full border-none" />
                        </div>
                    </div>
                );
            };

            const formatAiText = (text) => {
                return text.split('\n').map((line, idx) => {
                    const formattedLine = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    return <div key={idx} dangerouslySetInnerHTML={{ __html: formattedLine || '<br/>' }} />;
                });
            };

            return (
                <div className="flex flex-col h-screen w-full font-sans">
                    <header className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center z-20">
                        <div className="flex items-center gap-3">
                            <Icons.BookOpen />
                            <h1 className="text-lg font-bold">PaperLords Portal</h1>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsAiOpen(!isAiOpen)} className={`flex items-center gap-2 px-3 py-1.5 text-sm font-bold rounded-lg transition-all ${isAiOpen ? 'bg-indigo-500' : 'bg-indigo-600/30 text-indigo-300'}`}>
                                <Icons.Sparkles /> <span className="hidden sm:inline">AI Tutor</span>
                            </button>
                            <div className="flex bg-slate-800 p-1 rounded-lg text-[11px]">
                                {['qp', 'split', 'ms'].map(m => (
                                    <button key={m} onClick={() => setViewMode(m)} className={`px-2 py-1 rounded-md uppercase ${viewMode === m ? 'bg-white text-slate-900 font-bold' : 'text-slate-400'}`}>{m}</button>
                                ))}
                            </div>
                        </div>
                    </header>

                    <div className="bg-white border-b border-slate-200 px-4 py-2 flex flex-wrap gap-3 items-center z-10 shadow-sm">
                        {[
                            { label: 'Subject', val: subject, set: setSubject, opt: Object.keys(CONFIG) },
                            { label: 'Unit', val: unit, set: setUnit, opt: CONFIG[subject].units },
                            { label: 'Year', val: year, set: setYear, opt: YEARS },
                            { label: 'Month', val: month, set: setMonth, opt: MONTHS.map(m => m.value), labels: MONTHS }
                        ].map(group => (
                            <div key={group.label} className="flex flex-col">
                                <label className="text-[9px] font-bold text-slate-400 uppercase mb-0.5">{group.label}</label>
                                <select className="text-xs bg-slate-50 border border-slate-200 rounded p-1 outline-none focus:border-indigo-400" value={group.val} onChange={(e) => group.set(e.target.value)}>
                                    {group.opt.map(o => <option key={o} value={o}>{group.labels?.find(l => l.value === o)?.label || o}</option>)}
                                </select>
                            </div>
                        ))}
                    </div>

                    <main className="flex-1 flex gap-4 p-4 overflow-hidden">
                        {(viewMode === 'qp' || viewMode === 'split') && <PdfViewer title={`${subject} ${unit}`} type="QP" url={generateUrl('QP')} />}
                        {(viewMode === 'ms' || viewMode === 'split') && <PdfViewer title={`${subject} ${unit}`} type="MS" url={generateUrl('MS')} />}
                    </main>

                    {isAiOpen && (
                        <div className="absolute bottom-4 right-4 w-80 md:w-96 bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col z-50 overflow-hidden animate-in slide-in-from-bottom-5 duration-300" style={{ height: '500px' }}>
                            <div className="bg-indigo-600 text-white p-4 flex justify-between items-center">
                                <h3 className="font-bold flex items-center gap-2"><Icons.Sparkles /> Gemini Tutor</h3>
                                <button onClick={() => setIsAiOpen(false)} className="hover:bg-white/20 p-1 rounded-md"><Icons.X /></button>
                            </div>
                            <div className="flex-1 p-4 overflow-y-auto bg-slate-50 flex flex-col gap-3 text-sm">
                                {chatHistory.length === 0 && <p className="text-center text-slate-400 mt-10">Ask a question about this paper!</p>}
                                {chatHistory.map((msg, i) => (
                                    <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[85%] rounded-2xl px-3 py-2 ${msg.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-white border shadow-sm text-slate-800'}`}>
                                            {msg.role === 'ai' ? formatAiText(msg.text) : msg.text}
                                        </div>
                                    </div>
                                ))}
                                {isAiLoading && <div className="text-[10px] text-slate-400 animate-pulse font-bold uppercase tracking-widest">Generating solution...</div>}
                                <div ref={chatEndRef} />
                            </div>
                            <div className="p-3 border-t bg-white">
                                <div className="relative">
                                    <textarea value={aiQuery} onChange={(e) => setAiQuery(e.target.value)} onKeyDown={handleKeyDown} placeholder="How do I solve..." className="w-full bg-slate-100 rounded-xl pl-3 pr-10 py-2 text-sm resize-none focus:ring-1 focus:ring-indigo-400 outline-none" rows="2" />
                                    <button onClick={handleAskAi} disabled={isAiLoading || !aiQuery.trim()} className="absolute right-2 bottom-2 p-1.5 bg-indigo-600 text-white rounded-lg disabled:opacity-30"><Icons.Send /></button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
