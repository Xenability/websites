<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperLords IAL Portal</title>
    <!-- React and Babel CDNs: These allow the browser to understand your code -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS: This handles all the styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f1f5f9; }
        .overflow-y-auto { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- The type="text/babel" is the "magic" that makes this work -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CONFIG = {
            Maths: { folder: 'Maths', prefix: 'MATHS', units: ['P1', 'P2', 'P3', 'P4', 'S1', 'M1'] },
            Physics: { folder: 'Physics', prefix: 'PHYSICS', units: ['U1', 'U2', 'U3'] },
            Chemistry: { folder: 'Chemistry', prefix: 'CHEMISTRY', units: ['U1', 'U2', 'U3'] },
        };

        const YEARS = ['2026', '2025', '2024', '2023', '2022', '2021', '2020', '2019'];
        const MONTHS = [
            { label: 'January', value: 'Jan' },
            { label: 'May/June', value: 'MayJune' },
            { label: 'October', value: 'Oct' }
        ];

        const Icons = {
            BookOpen: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>,
            ExternalLink: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>,
            Sparkles: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>,
            Send: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
        };

        function App() {
            const [subject, setSubject] = useState('Maths');
            const [unit, setUnit] = useState('P1');
            const [year, setYear] = useState('2025');
            const [month, setMonth] = useState('MayJune');
            const [viewMode, setViewMode] = useState('split'); 
            const [isAiOpen, setIsAiOpen] = useState(false);
            const [aiQuery, setAiQuery] = useState('');
            const [chatHistory, setChatHistory] = useState([]);
            const [isAiLoading, setIsAiLoading] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => { setUnit(CONFIG[subject].units[0]); }, [subject]);
            useEffect(() => { if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, isAiLoading]);

            const generateUrl = (type) => {
                const info = CONFIG[subject];
                const folderPath = `${info.folder}/${month}%20${year}`;
                const fileName = `IAL_${info.prefix}_${year}_${month}_${unit}_${type}.pdf`;
                return `https://archive.paperlords.org/library/IAL/${folderPath}/${fileName}`;
            };

            const handleAskAi = async () => {
                if (!aiQuery.trim() || isAiLoading) return;

                let apiKey = sessionStorage.getItem('gemini_api_key');
                if (!apiKey) {
                    apiKey = prompt("Please enter your Gemini API Key to use the Tutor:");
                    if (apiKey) sessionStorage.setItem('gemini_api_key', apiKey);
                    else return;
                }

                const userMessage = aiQuery.trim();
                setChatHistory(prev => [...prev, { role: 'user', text: userMessage }]);
                setAiQuery('');
                setIsAiLoading(true);

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Paper Context: ${subject} ${unit} ${month} ${year}. Question: ${userMessage}` }] }] })
                    });
                    
                    if (!response.ok) {
                        sessionStorage.removeItem('gemini_api_key');
                        throw new Error("Invalid Key. Please try again.");
                    }
                    
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "Error.";
                    setChatHistory(prev => [...prev, { role: 'ai', text }]);
                } catch (error) {
                    setChatHistory(prev => [...prev, { role: 'ai', text: error.message }]);
                } finally {
                    setIsAiLoading(false);
                }
            };

            const PdfViewer = ({ title, url, type }) => (
                <div className="flex flex-col flex-1 h-full bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="flex justify-between items-center px-4 py-3 bg-slate-50 border-b border-slate-200">
                        <div className="flex items-center gap-2">
                            <span className={`px-2 py-1 text-[10px] font-bold rounded-md ${type === 'QP' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}`}>{type}</span>
                            <h2 className="font-semibold text-slate-700 text-xs truncate max-w-[120px] md:max-w-none">{title}</h2>
                        </div>
                        <a href={url} target="_blank" rel="noopener noreferrer" className="p-1.5 text-slate-500 hover:bg-slate-200 rounded-lg"><Icons.ExternalLink /></a>
                    </div>
                    <iframe src={`https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`} className="flex-1 w-full border-none" />
                </div>
            );

            return (
                <div className="flex flex-col h-screen w-full font-sans">
                    <header className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center z-20">
                        <div className="flex items-center gap-3">
                            <Icons.BookOpen />
                            <h1 className="text-lg font-bold">PaperLords Portal</h1>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsAiOpen(!isAiOpen)} className="flex items-center gap-2 px-3 py-1.5 text-sm font-bold rounded-lg bg-indigo-600/30 text-indigo-300">
                                <Icons.Sparkles /> AI Tutor
                            </button>
                            <div className="flex bg-slate-800 p-1 rounded-lg text-[10px]">
                                {['qp', 'split', 'ms'].map(m => (
                                    <button key={m} onClick={() => setViewMode(m)} className={`px-2 py-1 rounded-md uppercase ${viewMode === m ? 'bg-white text-slate-900' : 'text-slate-400'}`}>{m}</button>
                                ))}
                            </div>
                        </div>
                    </header>

                    <div className="bg-white border-b border-slate-200 px-4 py-2 flex flex-wrap gap-4 items-center shadow-sm">
                        <select className="text-xs p-1 border rounded" value={subject} onChange={(e) => setSubject(e.target.value)}>
                            {Object.keys(CONFIG).map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                        <select className="text-xs p-1 border rounded" value={unit} onChange={(e) => setUnit(e.target.value)}>
                            {CONFIG[subject].units.map(u => <option key={u} value={u}>{u}</option>)}
                        </select>
                        <select className="text-xs p-1 border rounded" value={year} onChange={(e) => setYear(e.target.value)}>
                            {YEARS.map(y => <option key={y} value={y}>{y}</option>)}
                        </select>
                        <select className="text-xs p-1 border rounded" value={month} onChange={(e) => setMonth(e.target.value)}>
                            {MONTHS.map(m => <option key={m.value} value={m.value}>{m.label}</option>)}
                        </select>
                    </div>

                    <main className="flex-1 flex gap-4 p-4 overflow-hidden">
                        {(viewMode === 'qp' || viewMode === 'split') && <PdfViewer title={`${subject} ${unit}`} type="QP" url={generateUrl('QP')} />}
                        {(viewMode === 'ms' || viewMode === 'split') && <PdfViewer title={`${subject} ${unit}`} type="MS" url={generateUrl('MS')} />}
                    </main>

                    {isAiOpen && (
                        <div className="absolute bottom-4 right-4 w-80 md:w-96 bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col z-50 overflow-hidden" style={{ height: '450px' }}>
                            <div className="bg-indigo-600 text-white p-4 flex justify-between items-center">
                                <h3 className="font-bold flex items-center gap-2">Gemini Tutor</h3>
                                <button onClick={() => setIsAiOpen(false)}><Icons.X /></button>
                            </div>
                            <div className="flex-1 p-4 overflow-y-auto text-sm space-y-3">
                                {chatHistory.map((msg, i) => (
                                    <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`p-2 rounded-lg ${msg.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-100'}`}>{msg.text}</div>
                                    </div>
                                ))}
                                <div ref={chatEndRef} />
                            </div>
                            <div className="p-3 border-t flex gap-2">
                                <input className="flex-1 p-2 bg-slate-100 rounded-lg text-sm" value={aiQuery} onChange={(e) => setAiQuery(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAskAi()} placeholder="Ask a question..." />
                                <button onClick={handleAskAi} className="p-2 bg-indigo-600 text-white rounded-lg"><Icons.Send /></button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
